<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하나 AI 학원</title>
  <link rel="icon" type="image/png" href="assets/mark.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .page-container {
      max-width: 800px;
      margin: 0 auto;
      padding: var(--spacing-2xl) 0;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: var(--spacing-lg);
      margin-bottom: var(--spacing-2xl);
    }

    .page-header a {
      color: var(--color-rose);
      text-decoration: none;
    }

    .page-content {
      background-color: var(--color-white);
      border: var(--card-border);
      border-radius: var(--card-radius);
      padding: var(--spacing-2xl);
      line-height: 1.8;
    }

    .page-content h2 {
      color: var(--color-rose);
      margin-bottom: var(--spacing-lg);
    }

    .page-content p {
      margin-bottom: var(--spacing-md);
      color: var(--color-text);
    }

    .loading {
      text-align: center;
      padding: var(--spacing-2xl);
      color: var(--color-text-light);
    }

    .error {
      background-color: var(--color-pink);
      border: 1px solid var(--color-rose);
      color: var(--color-rose);
      padding: var(--spacing-lg);
      border-radius: 8px;
      text-align: center;
    }

    /* [3-3] 상담 신청 양식 */
    .consult-form {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    .form-group label {
      font-weight: 600;
      color: var(--color-rose);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: var(--spacing-md);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--color-rose);
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
    }

    .form-buttons {
      display: flex;
      gap: var(--spacing-md);
      margin-top: var(--spacing-md);
    }

    .form-buttons button {
      flex: 1;
      padding: var(--spacing-md) var(--spacing-lg);
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .form-buttons .btn-submit {
      background-color: var(--color-rose);
      color: white;
    }

    .form-buttons .btn-submit:hover {
      background-color: #d4295f;
    }

    .form-buttons .btn-reset {
      background-color: var(--color-gray-light);
      color: var(--color-text);
    }

    .form-buttons .btn-reset:hover {
      background-color: var(--color-gray-lighter);
    }

    .consult-success {
      background-color: #dcfce7;
      border: 1px solid #22c55e;
      color: #166534;
      padding: var(--spacing-lg);
      border-radius: 8px;
      margin-bottom: var(--spacing-lg);
    }

    .consult-error {
      background-color: var(--color-pink);
      border: 1px solid var(--color-rose);
      color: var(--color-rose);
      padding: var(--spacing-lg);
      border-radius: 8px;
      margin-bottom: var(--spacing-lg);
    }

    /* [3-4] GPU PC 예약 양식 */
    .reserve-form {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }

    .reserve-form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-md);
    }

    .reserve-form-row.full {
      grid-template-columns: 1fr;
    }

    /* [3-4] 예약 현황 테이블 */
    .reserve-schedule {
      margin-top: var(--spacing-2xl);
      overflow-x: auto;
    }

    .reserve-schedule table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      overflow: hidden;
    }

    .reserve-schedule th,
    .reserve-schedule td {
      padding: var(--spacing-md);
      text-align: center;
      border-right: 1px solid var(--color-border);
    }

    .reserve-schedule th {
      background-color: var(--color-rose);
      color: white;
      font-weight: 600;
    }

    .reserve-schedule tr:nth-child(even) {
      background-color: var(--color-gray-lighter);
    }

    .reserve-slot {
      padding: var(--spacing-sm);
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.4;
    }

    .reserve-slot.booked {
      background-color: #fed7aa;
      color: #92400e;
    }

    .reserve-slot.available {
      background-color: #dcfce7;
      color: #15803d;
    }

    /* [3-5] 수강 신청 양식 */
    .enroll-form {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }

    .enroll-form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-md);
    }

    .enroll-form-row.full {
      grid-template-columns: 1fr;
    }

    /* [3-5] 금액 계산 표시 */
    .fee-summary {
      background-color: #fef3c7;
      border: 2px solid #f59e0b;
      padding: var(--spacing-lg);
      border-radius: 8px;
      margin: var(--spacing-md) 0;
    }

    .fee-row {
      display: flex;
      justify-content: space-between;
      padding: var(--spacing-sm) 0;
      font-size: 16px;
    }

    .fee-row.original {
      color: var(--color-text-light);
      text-decoration: line-through;
    }

    .fee-row.discount {
      color: #d97706;
      font-weight: 600;
    }

    .fee-row.total {
      border-top: 2px solid #f59e0b;
      padding-top: var(--spacing-md);
      color: var(--color-rose);
      font-size: 18px;
      font-weight: 700;
    }

    /* [3-5] 환불 기준 안내 */
    .refund-guide {
      background-color: #ede9fe;
      border-left: 4px solid var(--color-rose);
      padding: var(--spacing-lg);
      border-radius: 4px;
      margin-top: var(--spacing-2xl);
    }

    .refund-guide h3 {
      color: var(--color-rose);
      margin-bottom: var(--spacing-md);
    }

    .refund-guide ul {
      list-style: none;
      padding: 0;
    }

    .refund-guide li {
      padding: var(--spacing-sm) 0;
      color: var(--color-text);
      line-height: 1.6;
    }

    .refund-guide li::before {
      content: "• ";
      color: var(--color-rose);
      font-weight: bold;
      margin-right: var(--spacing-sm);
    }
  </style>
</head>
<body>

  <script>
    // [2-1] 메뉴 이름과 RAG 소제목 짝 맞춤
    const MENU_MAPPING = {
      '학원소개': { title: '학원 소개', section: '하나 AI 학원은 어떤 곳인가' },
      '운영시간': { title: '학원 소개', section: '운영 시간' },
      '오시는길': { title: '학원 소개', section: '오시는 길' },
      '기초반': { title: '학원 소개', section: '기초반' },
      '실무반': { title: '학원 소개', section: '실무반' },
      '시간표': { title: '시간표', section: null },
      '출석': { title: '수강 규정', section: '출석 체크' },
      '지각': { title: '수강 규정', section: '지각' },
      '조퇴': { title: '수강 규정', section: '조퇴' },
      '결석': { title: '수강 규정', section: '결석 연락' },
      '병결': { title: '수강 규정', section: '병결' },
      '수료규정': { title: '수강 규정', section: '수료' },
      '수강료': { title: '수강료와 환불', section: '수강료' },
      '할인': { title: '수강료와 환불', section: '할인' },
      '환불규정': { title: '수강료와 환불', section: '환불 기준' },
      '실습실이용': { title: '시설 이용', section: '실습실 이용 시간' },
      'GPU예약': { title: '시설 이용', section: 'GPU PC 예약' },
      '분실물': { title: '시설 이용', section: '분실물' },
      '보안': { title: '보안과 AI 사용', section: '외부 AI 서비스 금지' },
      'AI사용규칙': { title: '보안과 AI 사용', section: 'AI 사용 규칙' },
      '하나봇': { title: '학원 소개', section: '하나 AI 학원은 어떤 곳인가' },
      '상담신청': { title: '학원 소개', section: '운영 시간' },
      '공지사항': { title: '학원 소개', section: '학원 소개' },
      'FAQ': { title: '학원 소개', section: '학원 소개' },
    };

    // [3-3] 상담 신청 양식 렌더링
    function renderConsultForm() {
      document.getElementById('pageTitle').textContent = '수강 상담 신청';
      document.getElementById('pageBody').innerHTML = `
        <div class="consult-form">
          <div id="consultMessage"></div>

          <div class="form-group">
            <label for="studentId">가상 학번 *</label>
            <input type="text" id="studentId" placeholder="예: HANA-001" required>
          </div>

          <div class="form-group">
            <label for="course">관심 과정 *</label>
            <select id="course" required>
              <option value="">선택하세요</option>
              <option value="기초반">기초반 (4주, 월·화)</option>
              <option value="실무반">실무반 (8주, 수·목·금)</option>
              <option value="모름">아직 모르겠어요</option>
            </select>
          </div>

          <div class="form-group">
            <label for="desiredTime">희망 시간 * (평일 10:00~18:00)</label>
            <input type="time" id="desiredTime" placeholder="예: 14:30" required>
          </div>

          <div class="form-group">
            <label for="inquiry">문의 내용 *</label>
            <textarea id="inquiry" placeholder="궁금한 점을 자유롭게 작성해주세요." required></textarea>
          </div>

          <div class="form-buttons">
            <button class="btn-submit" onclick="submitConsult()">상담 신청</button>
            <button class="btn-reset" onclick="resetConsultForm()">초기화</button>
          </div>
        </div>
      `;
    }

    // [3-3] 상담 신청 제출
    async function submitConsult() {
      const studentId = document.getElementById('studentId').value;
      const course = document.getElementById('course').value;
      const desiredTime = document.getElementById('desiredTime').value;
      const inquiry = document.getElementById('inquiry').value;

      try {
        const response = await fetch('/api/consult', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            student_id: studentId,
            course: course,
            desired_time: desiredTime,
            inquiry: inquiry
          })
        });

        const data = await response.json();
        const messageDiv = document.getElementById('consultMessage');

        if (data.success) {
          messageDiv.innerHTML = `<div class="consult-success">✅ ${data.message}</div>`;
          document.getElementById('studentId').value = '';
          document.getElementById('course').value = '';
          document.getElementById('desiredTime').value = '';
          document.getElementById('inquiry').value = '';
        } else {
          messageDiv.innerHTML = `<div class="consult-error">⚠️ ${data.message}</div>`;
        }
      } catch (error) {
        console.error(error);
        document.getElementById('consultMessage').innerHTML = `<div class="consult-error">⚠️ 오류가 발생했습니다.</div>`;
      }
    }

    // [3-3] 상담 신청 양식 초기화
    function resetConsultForm() {
      document.getElementById('studentId').value = '';
      document.getElementById('course').value = '';
      document.getElementById('desiredTime').value = '';
      document.getElementById('inquiry').value = '';
      document.getElementById('consultMessage').innerHTML = '';
    }

    // [3-4] GPU PC 예약 양식 렌더링
    function renderReserveForm() {
      document.getElementById('pageTitle').textContent = 'GPU PC 예약';

      const today = new Date();
      const minDate = today.toISOString().split('T')[0];

      document.getElementById('pageBody').innerHTML = `
        <div class="reserve-form">
          <div id="reserveMessage"></div>

          <div class="reserve-form-row">
            <div class="form-group">
              <label for="studentIdReserve">가상 학번 *</label>
              <input type="text" id="studentIdReserve" placeholder="예: HANA-001" required>
            </div>

            <div class="form-group">
              <label for="reserveDate">날짜 * (평일만)</label>
              <input type="date" id="reserveDate" min="${minDate}" required>
            </div>
          </div>

          <div class="reserve-form-row">
            <div class="form-group">
              <label for="startTime">시작 시각 * (09:00 ~ 21:00)</label>
              <input type="time" id="startTime" required>
            </div>

            <div class="form-group">
              <label for="duration">이용 시간 *</label>
              <select id="duration" required>
                <option value="">선택하세요</option>
                <option value="2">2시간</option>
                <option value="4">4시간</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="pcNumber">PC 번호 * (GPU-1 ~ GPU-4)</label>
            <select id="pcNumber" required>
              <option value="">선택하세요</option>
              <option value="1">GPU-1</option>
              <option value="2">GPU-2</option>
              <option value="3">GPU-3</option>
              <option value="4">GPU-4</option>
            </select>
          </div>

          <div class="form-buttons">
            <button class="btn-submit" onclick="submitReserve()">예약</button>
            <button class="btn-reset" onclick="resetReserveForm()">초기화</button>
          </div>

          <div id="scheduleContainer" class="reserve-schedule"></div>
        </div>
      `;

      loadReserveSchedule();
    }

    // [3-4] GPU PC 예약 제출
    async function submitReserve() {
      const studentId = document.getElementById('studentIdReserve').value;
      const date = document.getElementById('reserveDate').value;
      const startTime = document.getElementById('startTime').value;
      const duration = parseInt(document.getElementById('duration').value);
      const pcNumber = parseInt(document.getElementById('pcNumber').value);

      try {
        const response = await fetch('/api/reserve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            student_id: studentId,
            date: date,
            start_time: startTime,
            duration: duration,
            pc_number: pcNumber
          })
        });

        const data = await response.json();
        const messageDiv = document.getElementById('reserveMessage');

        if (data.success) {
          messageDiv.innerHTML = `<div class="consult-success">✅ ${data.message}</div>`;
          document.getElementById('studentIdReserve').value = '';
          document.getElementById('reserveDate').value = '';
          document.getElementById('startTime').value = '';
          document.getElementById('duration').value = '';
          document.getElementById('pcNumber').value = '';
          loadReserveSchedule();
        } else {
          messageDiv.innerHTML = `<div class="consult-error">⚠️ ${data.message}</div>`;
        }
      } catch (error) {
        console.error(error);
        document.getElementById('reserveMessage').innerHTML = `<div class="consult-error">⚠️ 오류가 발생했습니다.</div>`;
      }
    }

    // [3-4] GPU PC 예약 현황 로드
    async function loadReserveSchedule() {
      const dateInput = document.getElementById('reserveDate');
      if (!dateInput || !dateInput.value) return;

      const date = dateInput.value;

      try {
        const response = await fetch(`/api/reserve?date=${date}`);
        const data = await response.json();
        const reserves = data.reserves || [];

        // 시간표 생성
        let html = `<h3>${date} 예약 현황</h3><table><thead><tr><th>시간</th>`;
        for (let i = 1; i <= 4; i++) {
          html += `<th>GPU-${i}</th>`;
        }
        html += `</tr></thead><tbody>`;

        // 09:00 ~ 21:00 시간대 표시
        for (let hour = 9; hour < 21; hour++) {
          html += `<tr><td>${hour}:00</td>`;
          for (let pc = 1; pc <= 4; pc++) {
            const reserved = reserves.find(r => r.pc_number === pc && r.start_hour === hour);
            if (reserved) {
              html += `<td><div class="reserve-slot booked">${reserved.student_id}<br>${reserved.duration}시간</div></td>`;
            } else {
              html += `<td><div class="reserve-slot available">사용 가능</div></td>`;
            }
          }
          html += `</tr>`;
        }

        html += `</tbody></table>`;
        document.getElementById('scheduleContainer').innerHTML = html;
      } catch (error) {
        console.error(error);
      }
    }

    // [3-4] GPU PC 예약 양식 초기화
    function resetReserveForm() {
      document.getElementById('studentIdReserve').value = '';
      document.getElementById('reserveDate').value = '';
      document.getElementById('startTime').value = '';
      document.getElementById('duration').value = '';
      document.getElementById('pcNumber').value = '';
      document.getElementById('reserveMessage').innerHTML = '';
    }

    // [3-5] 수강 신청 양식 렌더링
    function renderEnrollForm() {
      document.getElementById('pageTitle').textContent = '수강 신청';
      document.getElementById('pageBody').innerHTML = `
        <div class="enroll-form">
          <div id="enrollMessage"></div>

          <div class="enroll-form-row">
            <div class="form-group">
              <label for="studentIdEnroll">가상 학번 *</label>
              <input type="text" id="studentIdEnroll" placeholder="예: HANA-001" required>
            </div>

            <div class="form-group">
              <label for="enrollCourse">과정 *</label>
              <select id="enrollCourse" onchange="updateFee()" required>
                <option value="">선택하세요</option>
                <option value="기초반">기초반 (월 30만 원)</option>
                <option value="실무반">실무반 (월 50만 원)</option>
              </select>
            </div>
          </div>

          <div class="enroll-form-row">
            <div class="form-group">
              <label for="enrollMonths">개월 수 *</label>
              <select id="enrollMonths" onchange="updateFee()" required>
                <option value="">선택하세요</option>
                <option value="1">1개월</option>
                <option value="2">2개월</option>
                <option value="3">3개월</option>
                <option value="4">4개월</option>
                <option value="5">5개월</option>
                <option value="6">6개월</option>
              </select>
            </div>

            <div class="form-group">
              <label for="enrollDiscount">할인</label>
              <select id="enrollDiscount" onchange="updateFee()" required>
                <option value="없음">할인 없음</option>
                <option value="재수강">재수강 (50% 할인)</option>
                <option value="친구">친구와 함께 (10% 할인)</option>
              </select>
            </div>
          </div>

          <div class="fee-summary" id="feeSummary">
            <div class="fee-row original">
              <span>원래 금액</span>
              <span id="originalFee">0원</span>
            </div>
            <div class="fee-row discount" id="discountRow" style="display: none;">
              <span id="discountLabel">할인</span>
              <span id="discountAmount">0원</span>
            </div>
            <div class="fee-row total">
              <span>낼 금액</span>
              <span id="finalFee">0원</span>
            </div>
          </div>

          <div class="form-buttons">
            <button class="btn-submit" onclick="submitEnroll()">수강 신청</button>
            <button class="btn-reset" onclick="resetEnrollForm()">초기화</button>
          </div>

          <div class="refund-guide">
            <h3>📌 환불 기준</h3>
            <ul>
              <li><strong>개강 전 취소</strong>: 수강료 전액 환불</li>
              <li><strong>수업 기간의 1/3 전</strong>: 수강료의 2/3 환불</li>
              <li><strong>수업 기간의 1/2 전</strong>: 수강료의 1/2 환불</li>
              <li><strong>수업 기간의 1/2 이후</strong>: 환불 없음</li>
              <li>환불 신청 후 <strong>7일 내</strong>에 처리됩니다</li>
            </ul>
          </div>
        </div>
      `;
    }

    // [3-5] 수강료 실시간 계산
    async function updateFee() {
      const course = document.getElementById('enrollCourse').value;
      const months = parseInt(document.getElementById('enrollMonths').value) || 0;
      const discountType = document.getElementById('enrollDiscount').value;

      if (!course || !months) {
        document.getElementById('originalFee').textContent = '0원';
        document.getElementById('finalFee').textContent = '0원';
        document.getElementById('discountRow').style.display = 'none';
        return;
      }

      try {
        const response = await fetch('/api/fee', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            course: course,
            months: months,
            discount_type: discountType
          })
        });

        const data = await response.json();
        document.getElementById('originalFee').textContent = data.original_fee.toLocaleString() + '원';
        document.getElementById('finalFee').textContent = data.final_fee.toLocaleString() + '원';

        if (data.discount_amount > 0) {
          document.getElementById('discountLabel').textContent = data.discount_name;
          document.getElementById('discountAmount').textContent = '-' + data.discount_amount.toLocaleString() + '원';
          document.getElementById('discountRow').style.display = 'flex';
        } else {
          document.getElementById('discountRow').style.display = 'none';
        }
      } catch (error) {
        console.error(error);
      }
    }

    // [3-5] 수강 신청 제출
    async function submitEnroll() {
      const studentId = document.getElementById('studentIdEnroll').value;
      const course = document.getElementById('enrollCourse').value;
      const months = parseInt(document.getElementById('enrollMonths').value);
      const discountType = document.getElementById('enrollDiscount').value;

      if (!studentId || !course || !months) {
        document.getElementById('enrollMessage').innerHTML = `<div class="consult-error">⚠️ 모든 항목을 입력해주세요</div>`;
        return;
      }

      try {
        const response = await fetch('/api/enroll', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            student_id: studentId,
            course: course,
            months: months,
            discount_type: discountType
          })
        });

        const data = await response.json();
        const messageDiv = document.getElementById('enrollMessage');

        if (data.success) {
          messageDiv.innerHTML = `<div class="consult-success">✅ ${data.message}<br>납부 금액: ${data.final_fee.toLocaleString()}원</div>`;
          document.getElementById('studentIdEnroll').value = '';
          document.getElementById('enrollCourse').value = '';
          document.getElementById('enrollMonths').value = '';
          document.getElementById('enrollDiscount').value = '없음';
          updateFee();
        } else {
          messageDiv.innerHTML = `<div class="consult-error">⚠️ ${data.message}</div>`;
        }
      } catch (error) {
        console.error(error);
        document.getElementById('enrollMessage').innerHTML = `<div class="consult-error">⚠️ 오류가 발생했습니다.</div>`;
      }
    }

    // [3-5] 수강 신청 양식 초기화
    function resetEnrollForm() {
      document.getElementById('studentIdEnroll').value = '';
      document.getElementById('enrollCourse').value = '';
      document.getElementById('enrollMonths').value = '';
      document.getElementById('enrollDiscount').value = '없음';
      document.getElementById('enrollMessage').innerHTML = '';
      updateFee();
    }

    // [3-2] 페이지 로드 (RAG_PLAN.md 또는 pages.md에서)
    async function loadPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const pageId = urlParams.get('id');

      if (!pageId) {
        document.getElementById('pageBody').innerHTML = '<div class="error">페이지를 찾을 수 없습니다.</div>';
        return;
      }

      // [3-3] 상담 신청 특수 처리
      if (pageId === '상담신청') {
        renderConsultForm();
        return;
      }

      // [3-4] GPU PC 예약 특수 처리
      if (pageId === 'GPU예약') {
        renderReserveForm();
        return;
      }

      // [3-5] 수강 신청 특수 처리
      if (pageId === '수강신청') {
        renderEnrollForm();
        return;
      }

      const mapping = MENU_MAPPING[pageId];

      try {
        // API에서 문서 로드
        const response = await fetch('/api/docs');
        const docs = await response.json();

        // RAG_PLAN.md에 있으면 그것 사용
        if (mapping && docs[mapping.title]) {
          const title = mapping.title;
          const section = mapping.section;

          // 제목 설정
          document.getElementById('pageTitle').textContent = section || title;

          // 섹션이 없으면 모든 내용 표시
          if (!section) {
            let content = '';
            for (const [key, value] of Object.entries(docs[title])) {
              content += `<h2>${key}</h2><p>${value}</p>`;
            }
            document.getElementById('pageBody').innerHTML = content;
          } else if (docs[title][section]) {
            document.getElementById('pageBody').innerHTML = `<h2>${section}</h2><p>${docs[title][section]}</p>`;
          } else {
            throw new Error(`"${section}" 항목을 찾을 수 없습니다.`);
          }
          return;
        }

        // RAG_PLAN.md에 없으면 pages.md에서 찾기
        const pagesResponse = await fetch('/api/pages');
        const pages = await pagesResponse.json();

        if (pages[pageId]) {
          document.getElementById('pageTitle').textContent = pageId;

          // 모든 소제목 내용 표시
          let content = '';
          for (const [key, value] of Object.entries(pages[pageId])) {
            // 마크다운 줄 바꿈을 HTML <br>로 변환
            const htmlContent = value.replace(/\n\n/g, '<br><br>').replace(/\n- /g, '<br>• ').replace(/\n/g, '<br>');
            content += `<h2>${key}</h2><div>${htmlContent}</div>`;
          }
          document.getElementById('pageBody').innerHTML = content;
          return;
        }

        // 둘 다 없으면 준비 중 페이지
        document.getElementById('pageTitle').textContent = '준비 중입니다';
        document.getElementById('pageBody').innerHTML = `
          <div style="text-align: center; padding: 40px 0;">
            <p style="font-size: 18px; color: var(--color-text-light); margin-bottom: 20px;">준비 중인 페이지예요</p>
            <a href="index.html" class="btn btn-primary" style="display: inline-block; text-decoration: none;">← 홈으로</a>
          </div>
        `;
      } catch (error) {
        console.error(error);
        document.getElementById('pageBody').innerHTML = `
          <div style="text-align: center; padding: 40px 0;">
            <p style="color: var(--color-rose); margin-bottom: 20px;">준비 중인 페이지예요</p>
            <a href="index.html" class="btn btn-primary" style="display: inline-block; text-decoration: none;">← 홈으로</a>
          </div>
        `;
      }
    }

    loadPage();
  </script>
</body>
</html>
