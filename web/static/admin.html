<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하나 AI 학원 - 수업용 관리자 화면</title>
  <link rel="icon" type="image/png" href="assets/mark.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: var(--spacing-2xl);
    }

    .admin-header {
      background-color: #fee2e2;
      border-left: 4px solid var(--color-rose);
      padding: var(--spacing-lg);
      border-radius: 4px;
      margin-bottom: var(--spacing-2xl);
    }

    .admin-header h1 {
      color: var(--color-rose);
      margin: 0 0 var(--spacing-sm) 0;
    }

    .admin-header p {
      color: #7f1d1d;
      margin: 0;
      font-size: 14px;
    }

    .admin-tabs {
      display: flex;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
      border-bottom: 2px solid var(--color-border);
    }

    .admin-tab-btn {
      padding: var(--spacing-md) var(--spacing-lg);
      border: none;
      background: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--color-text-light);
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .admin-tab-btn.active {
      color: var(--color-rose);
      border-bottom-color: var(--color-rose);
    }

    .admin-tab-content {
      display: none;
    }

    .admin-tab-content.active {
      display: block;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      overflow: hidden;
    }

    .admin-table th {
      background-color: var(--color-rose);
      color: white;
      padding: var(--spacing-md);
      text-align: left;
      font-weight: 600;
    }

    .admin-table td {
      padding: var(--spacing-md);
      border-bottom: 1px solid var(--color-border);
    }

    .admin-table tr:hover {
      background-color: var(--color-gray-lighter);
    }

    .admin-empty {
      text-align: center;
      padding: var(--spacing-2xl);
      color: var(--color-text-light);
    }

    .admin-loading {
      text-align: center;
      padding: var(--spacing-2xl);
      color: var(--color-text-light);
    }

    .back-link {
      display: inline-block;
      margin-bottom: var(--spacing-lg);
      color: var(--color-rose);
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <a href="index.html" class="back-link">← 메인으로</a>

    <div class="admin-header">
      <h1>⚙️ 수업용 관리자 화면</h1>
      <p>수업 목적으로만 사용하는 데모 사이트입니다. 실제 운영 데이터가 아닙니다.</p>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab-btn active" data-tab="consult">상담 신청</button>
      <button class="admin-tab-btn" data-tab="reserve">GPU PC 예약</button>
      <button class="admin-tab-btn" data-tab="enroll">수강 신청</button>
    </div>

    <!-- 상담 신청 -->
    <div id="consult" class="admin-tab-content active">
      <table class="admin-table">
        <thead>
          <tr>
            <th>접수번호</th>
            <th>학번</th>
            <th>관심 과정</th>
            <th>희망 시간</th>
            <th>신청일</th>
            <th>문의 내용</th>
          </tr>
        </thead>
        <tbody id="consultList">
          <tr><td colspan="6" class="admin-loading">로드 중...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- GPU PC 예약 -->
    <div id="reserve" class="admin-tab-content">
      <table class="admin-table">
        <thead>
          <tr>
            <th>예약번호</th>
            <th>학번</th>
            <th>날짜</th>
            <th>시간</th>
            <th>이용시간</th>
            <th>PC</th>
          </tr>
        </thead>
        <tbody id="reserveList">
          <tr><td colspan="6" class="admin-loading">로드 중...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 수강 신청 -->
    <div id="enroll" class="admin-tab-content">
      <table class="admin-table">
        <thead>
          <tr>
            <th>신청번호</th>
            <th>학번</th>
            <th>과정</th>
            <th>개월</th>
            <th>할인</th>
            <th>금액</th>
            <th>신청일</th>
          </tr>
        </thead>
        <tbody id="enrollList">
          <tr><td colspan="7" class="admin-loading">로드 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 탭 전환
    document.querySelectorAll('.admin-tab-btn').forEach(btn => {
      btn.addEventListener('click', async function() {
        const tabName = this.dataset.tab;

        // 탭 버튼 활성화
        document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');

        // 탭 컨텐츠 활성화
        document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');

        // 데이터 로드
        if (tabName === 'consult') {
          loadConsults();
        } else if (tabName === 'reserve') {
          loadReserves();
        } else if (tabName === 'enroll') {
          loadEnrolls();
        }
      });
    });

    // 상담 신청 로드
    async function loadConsults() {
      try {
        const response = await fetch('/api/consult');
        const data = await response.json();
        const consults = data.consults || [];

        let html = '';
        if (consults.length === 0) {
          html = '<tr><td colspan="6" class="admin-empty">신청 내역이 없습니다</td></tr>';
        } else {
          consults.forEach(c => {
            const date = new Date(c.created_at).toLocaleDateString('ko-KR');
            html += `<tr>
              <td><strong>${c.consult_id}</strong></td>
              <td>${c.student_id}</td>
              <td>${c.course}</td>
              <td>${c.desired_time}</td>
              <td>${date}</td>
              <td>${c.inquiry.substring(0, 30)}...</td>
            </tr>`;
          });
        }
        document.getElementById('consultList').innerHTML = html;
      } catch (error) {
        document.getElementById('consultList').innerHTML = '<tr><td colspan="6" class="admin-empty">오류가 발생했습니다</td></tr>';
      }
    }

    // GPU PC 예약 로드
    async function loadReserves() {
      try {
        const response = await fetch('/api/reserves');
        const data = await response.json();
        const reserves = data.reserves || [];

        let html = '';
        if (reserves.length === 0) {
          html = '<tr><td colspan="6" class="admin-empty">예약 내역이 없습니다</td></tr>';
        } else {
          reserves.forEach(r => {
            html += `<tr>
              <td><strong>${r.reserve_id}</strong></td>
              <td>${r.student_id}</td>
              <td>${r.date}</td>
              <td>${r.start_time}</td>
              <td>${r.duration}시간</td>
              <td>GPU-${r.pc_number}</td>
            </tr>`;
          });
        }
        document.getElementById('reserveList').innerHTML = html;
      } catch (error) {
        document.getElementById('reserveList').innerHTML = '<tr><td colspan="6" class="admin-empty">오류가 발생했습니다</td></tr>';
      }
    }

    // 수강 신청 로드
    async function loadEnrolls() {
      try {
        const response = await fetch('/api/enroll');
        const data = await response.json();
        const enrolls = data.enrolls || [];

        let html = '';
        if (enrolls.length === 0) {
          html = '<tr><td colspan="7" class="admin-empty">신청 내역이 없습니다</td></tr>';
        } else {
          enrolls.forEach(e => {
            const date = new Date(e.created_at).toLocaleDateString('ko-KR');
            html += `<tr>
              <td><strong>${e.enroll_id}</strong></td>
              <td>${e.student_id}</td>
              <td>${e.course}</td>
              <td>${e.months}개월</td>
              <td>${e.discount_type}</td>
              <td>${e.final_fee.toLocaleString()}원</td>
              <td>${date}</td>
            </tr>`;
          });
        }
        document.getElementById('enrollList').innerHTML = html;
      } catch (error) {
        document.getElementById('enrollList').innerHTML = '<tr><td colspan="7" class="admin-empty">오류가 발생했습니다</td></tr>';
      }
    }

    // 초기 로드
    loadConsults();
  </script>
</body>
</html>
