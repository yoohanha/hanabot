# [5-7] AWS GPU 서버용 Docker Compose 오버라이드
# 기본 docker-compose.yml 에 덮어씌우는 설정만 포함
# 사용법: docker compose -f docker-compose.yml -f labs/5-7/aws/docker-compose.aws.yml up -d

version: '3.8'

services:
  hanabot:
    # [5-7] Ollama 서버 주소 오버라이드 (host.docker.internal 사용)
    environment:
      # [5-7] 호스트의 Ollama 접근 (Linux 에서는 host-gateway 매핑 필요)
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    # [5-7] 호스트명 매핑 (Linux 에서 host.docker.internal 지원)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # [5-7] 재시작 정책 (EC2 재부팅 시에도 자동 재시작)
    restart: unless-stopped
